<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css_Interno</title>
    <!--Declaração do CSS interno -->
    <style>
        h1{
            color: rgb(159, 22, 22);
            text-align: center;
            font-size: 72px;
        }
        p{
            color: rgb(0, 0, 0);
            text-align: center;
            font-size: 24px;
        }
        .fonte{
            color: blue;
            text-align: center;
            
        }
    </style>
</head>
<body>
    <h1>Pedro Ferreira Magalhães</h1>
    <p>Estudante de Desenvolvimento de sistemas</p>
    <p>Lista de Cursos</p>
    <h2 class="fonte">Lista de cursos TRANSVERSAIS</h2>
</body>
</html>
